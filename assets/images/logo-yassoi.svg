<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dégradé Flamme Principale -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E83A14" />
      <stop offset="60%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="#FF2A00" />
    </linearGradient>

    <!-- Dégradé Flamme Interne / Chaleur -->
    <linearGradient id="innerFireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>

    <!-- Filtre Ombre Douce Marmite & Flammes -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E83A14" flood-opacity="0.3" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. SPATULE DE CUISINE (Inclinée en arrière-plan) -->
  <!-- ========================================== -->
  <g transform="rotate(-18 250 250)">
    <!-- Manche de spatule -->
    <rect x="85" y="222" width="160" height="18" rx="9" fill="#D32F2F" />
    <!-- Tête de spatule à droite -->
    <rect x="350" y="212" width="65" height="42" rx="8" fill="#D32F2F" />
    <!-- Fentes de la spatule -->
    <rect x="362" y="218" width="7" height="30" rx="3.5" fill="#FFFFFF" />
    <rect x="378" y="218" width="7" height="30" rx="3.5" fill="#FFFFFF" />
    <rect x="394" y="218" width="7" height="30" rx="3.5" fill="#FFFFFF" />
  </g>

  <!-- ========================================== -->
  <!-- 2. FLAMMES ARDENTES DYNAMIQUES (Style Spice Avenue) -->
  <!-- ========================================== -->
  <!-- Grande Flamme Principale -->
  <path d="M 250,70 
           C 255,95 240,115 235,130 
           C 220,110 215,85 228,60 
           C 200,85 195,130 210,165 
           C 185,150 178,125 182,105 
           C 160,135 160,175 185,205 
           C 155,190 148,165 152,145 
           C 125,185 130,235 165,270 
           C 150,265 140,250 142,235 
           C 120,265 125,310 160,335
           L 340,335
           C 375,310 380,265 358,235 
           C 360,250 350,265 335,270 
           C 370,235 375,185 348,145 
           C 352,165 345,190 315,205 
           C 340,175 340,135 318,105 
           C 322,125 315,150 290,165 
           C 305,130 300,85 272,60 
           C 285,85 280,110 265,130 
           C 260,115 245,95 250,70 Z" 
        fill="url(#fireGrad)" filter="url(#softGlow)" />

  <!-- Détails et flammèches intérieures de contraste -->
  <path d="M 250,110 
           C 260,140 248,170 238,190 
           C 225,160 232,130 250,110 Z" 
        fill="#FFFFFF" opacity="0.9" />

  <path d="M 215,150 
           C 210,175 195,195 185,205 
           C 180,185 195,165 215,150 Z" 
        fill="#FFFFFF" opacity="0.85" />

  <path d="M 285,150 
           C 290,175 305,195 315,205 
           C 320,185 305,165 285,150 Z" 
        fill="#FFFFFF" opacity="0.85" />

  <!-- ========================================== -->
  <!-- 3. ÉNORME NUAGE / BULLE DE CONTOUR BLANC (Style Spice Avenue) -->
  <!-- ========================================== -->
  <!-- Nuage d'arrière-plan blanc pour faire claquer le lettrage -->
  <g filter="url(#badgeShadow)">
    <path d="M 170,205 
             C 145,205 130,225 135,250 
             C 120,260 115,280 125,305 
             C 115,325 125,355 155,365 
             C 180,375 320,375 345,365 
             C 375,355 385,325 375,305 
             C 385,280 380,260 365,250 
             C 370,225 355,205 330,205 
             C 305,195 195,195 170,205 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- ========================================== -->
  <!-- 4. TEXTE POP VIBRANT : YASSOI (Ligne 1) -->
  <!-- ========================================== -->
  <g id="text-yassoi">
    <!-- Contour blanc supplémentaire pour isolation maximale -->
    <text x="250" y="268" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" 
          font-size="64" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="2" 
          stroke="#FFFFFF" 
          stroke-width="16" 
          stroke-linejoin="round" 
          stroke-linecap="round" 
          fill="#E83A14">
      YASSOI
    </text>
    
    <!-- Coeur du texte YASSOI -->
    <text x="250" y="268" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" 
          font-size="64" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="2" 
          fill="#E83A14">
      YASSOI
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 5. TEXTE POP VIBRANT : ON MANGE OÙ (Ligne 2) -->
  <!-- ========================================== -->
  <g id="text-on-mange-ou">
    <!-- Contour blanc -->
    <text x="250" y="335" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" 
          font-size="44" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="1" 
          stroke="#FFFFFF" 
          stroke-width="14" 
          stroke-linejoin="round" 
          stroke-linecap="round" 
          fill="#E83A14">
      ON MANGE OÙ ?
    </text>
    
    <!-- Coeur du texte ON MANGE OÙ -->
    <text x="250" y="335" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" 
          font-size="44" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="1" 
          fill="#E83A14">
      ON MANGE OÙ ?
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 6. LA MARMITE NOIRE IVOIRIENNE (Wok / Canari) -->
  <!-- ========================================== -->
  <g id="marmite-canari">
    <!-- Anse Gauche (Poignée marmite) -->
    <rect x="42" y="358" width="60" height="20" rx="10" fill="none" stroke="#12100E" stroke-width="9" />

    <!-- Anse Droite (Poignée marmite) -->
    <rect x="398" y="358" width="60" height="20" rx="10" fill="none" stroke="#12100E" stroke-width="9" />

    <!-- Rebord supérieur de la marmite (lèvre métallique) -->
    <rect x="75" y="355" width="350" height="14" rx="7" fill="#12100E" />

    <!-- Corps de la Marmite (Demi-lune profonde) -->
    <path d="M 85,362 
             C 95,445 185,465 250,465 
             C 315,465 405,445 415,362 Z" 
          fill="#12100E" />

    <!-- Reflet élégant sur la marmite pour le volume 3D -->
    <path d="M 120,380 
             C 125,415 160,435 195,442 
             C 170,432 140,412 135,385 Z" 
          fill="#FFFFFF" opacity="0.12" />
  </g>
</svg>
